<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Webcraft: C++, WebGL, and JavaScript 3D Voxel Engine inspired by Notch's original Minecraft Cave Game (Pre-Classic). Playable directly in browser.">
    <title>Webcraft - Minecraft Cave Game Phase</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟩</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main WebGL 3D Canvas -->
    <main>
        <canvas id="renderCanvas"></canvas>
    </main>

    <!-- Crosshair -->
    <div id="crosshair"></div>

    <!-- F3 Debug HUD -->
    <header>
        <div id="debugHud"></div>
    </header>

    <!-- Inventory Hotbar -->
    <section id="hotbarContainer" aria-label="Inventory Hotbar">
        <div class="hotbar-slot active" id="slot-0" title="Grass Block">
            <span class="slot-key">1</span>
            <div class="block-preview preview-grass"></div>
        </div>
        <div class="hotbar-slot" id="slot-1" title="Dirt Block">
            <span class="slot-key">2</span>
            <div class="block-preview preview-dirt"></div>
        </div>
        <div class="hotbar-slot" id="slot-2" title="Stone Block">
            <span class="slot-key">3</span>
            <div class="block-preview preview-stone"></div>
        </div>
        <div class="hotbar-slot" id="slot-3" title="Cobblestone Block">
            <span class="slot-key">4</span>
            <div class="block-preview preview-cobble"></div>
        </div>
        <div class="hotbar-slot" id="slot-4" title="Planks Block">
            <span class="slot-key">5</span>
            <div class="block-preview preview-planks"></div>
        </div>
        <div class="hotbar-slot" id="slot-5" title="Bricks Block">
            <span class="slot-key">6</span>
            <div class="block-preview preview-bricks"></div>
        </div>
    </section>

    <!-- Start & Pointer Lock Overlay -->
    <div id="startOverlay">
        <div class="start-card">
            <h1 class="game-title">WEBCRAFT</h1>
            <p class="game-subtitle">Cave Game Phase (0.1.0)</p>
            
            <div class="start-btn">CLICK TO PLAY</div>

            <div class="controls-guide">
                <div><strong>WASD</strong> : Move</div>
                <div><strong>SPACE</strong> : Jump</div>
                <div><strong>SHIFT</strong> : Sneak</div>
                <div><strong>LEFT CLICK</strong> : Mine Block</div>
                <div><strong>RIGHT CLICK</strong> : Place Block</div>
                <div><strong>1 - 6 / WHEEL</strong> : Hotbar</div>
                <div><strong>F3</strong> : Debug HUD</div>
                <div><strong>ESC</strong> : Release Mouse</div>
            </div>
        </div>
    </div>

    <!-- Optional Emscripten Generated JS -->
    <script src="js/webcraft_wasm.js" onerror="console.log('Using JS Fallback Engine');"></script>

    <!-- Engine Scripts -->
    <script src="js/textures.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/wasm_bridge.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
